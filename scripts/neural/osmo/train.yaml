# Train the Particle NeRD network from scratch on the train and validation episodes, on four GPUs.
# Submit with: scripts/neural/osmo/submit.sh --workflow scripts/neural/osmo/train.yaml PRIVATE_OUTPUT_URI
# The checkpoints (best.pt, last.pt) and metrics.jsonl are written to <PRIVATE_OUTPUT_URI>/<workflow id>/train/model.
workflow:
  name: "{{ workflow_name }}"
  resources:
    default:
      gpu: 4
      cpu: 32
      memory: 128Gi
      storage: "{{ storage }}"
      platform: "{{ platform }}"
  tasks:
  - name: train
    image: "{{ image }}"
    command: [bash, /tmp/run.sh]
    environment:
      HEADLESS: "1"
      PYTHONUNBUFFERED: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      NCCL_DEBUG: WARN
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
      UV_PROJECT_ENVIRONMENT: /tmp/isaaclab-venv
      UV_INSTALL_DIR: /tmp/uv
      UV_NO_MODIFY_PATH: "1"
      UV_VERSION: "{{ uv_version }}"
    files:
    - path: /tmp/run.sh
      contents: |
        set -euo pipefail
        mkdir -p '{{output}}'
        exec > >(tee -a "{{output}}/job.log") 2>&1
        printf '%s  %s\n' '{{ source_sha256 }}' '{{input:0}}/source.tar.gz' | sha256sum --check --strict
        mkdir -p /tmp/isaaclab
        tar -xzf '{{input:0}}/source.tar.gz' -C /tmp/isaaclab
        data_root=$(dirname '{{input:0}}')
        unset PYTHONPATH VIRTUAL_ENV DISPLAY
        export PATH="/tmp/uv:$PATH"
        if ! command -v uv >/dev/null; then
          curl --fail --location --retry 3 "https://astral.sh/uv/{{ uv_version }}/install.sh" | sh
        fi
        cd /tmp/isaaclab
        uv sync --locked --no-dev
        uv run --no-sync torchrun --standalone --nproc_per_node=4 scripts/neural/train.py \
          --dataset "$data_root" --output '{{output}}/model' \
          --steps '{{ steps }}' --horizon 100 --validation-count 24 --validate-every 250 \
          --rest-fraction '{{ rest_fraction }}' --rest-steps '{{ rest_steps }}' --rest-segment '{{ rest_segment }}' \
          --rest-windows {{ extra_args }}
    inputs:
    - url: "{{ source_url }}"
    - url: "{{ object_url }}/train/flat/lateral_push/"
    - url: "{{ object_url }}/train/flat/vertical_push/"
    - url: "{{ object_url }}/train/flat/impact/"
    - url: "{{ object_url }}/train/flat/rest/"
    - url: "{{ sand_url }}/train/flat/freefall/"
    - url: "{{ sand_url }}/train/flat/rest_bed/"
    - url: "{{ object_url }}/train/slope/lateral_push/"
    - url: "{{ object_url }}/train/slope/vertical_push/"
    - url: "{{ object_url }}/train/slope/impact/"
    - url: "{{ object_url }}/train/slope/rest/"
    - url: "{{ sand_url }}/train/slope/freefall/"
    - url: "{{ sand_url }}/train/slope/rest_bed/"
    - url: "{{ object_url }}/train/wave/lateral_push/"
    - url: "{{ object_url }}/train/wave/vertical_push/"
    - url: "{{ object_url }}/train/wave/impact/"
    - url: "{{ object_url }}/train/wave/rest/"
    - url: "{{ sand_url }}/train/wave/freefall/"
    - url: "{{ sand_url }}/train/wave/rest_bed/"
    - url: "{{ object_url }}/validation/flat/lateral_push/"
    - url: "{{ object_url }}/validation/flat/vertical_push/"
    - url: "{{ object_url }}/validation/flat/impact/"
    - url: "{{ object_url }}/validation/flat/rest/"
    - url: "{{ sand_url }}/validation/flat/freefall/"
    - url: "{{ sand_url }}/validation/flat/rest_bed/"
    - url: "{{ object_url }}/validation/slope/lateral_push/"
    - url: "{{ object_url }}/validation/slope/vertical_push/"
    - url: "{{ object_url }}/validation/slope/impact/"
    - url: "{{ object_url }}/validation/slope/rest/"
    - url: "{{ sand_url }}/validation/slope/freefall/"
    - url: "{{ sand_url }}/validation/slope/rest_bed/"
    - url: "{{ object_url }}/validation/wave/lateral_push/"
    - url: "{{ object_url }}/validation/wave/vertical_push/"
    - url: "{{ object_url }}/validation/wave/impact/"
    - url: "{{ object_url }}/validation/wave/rest/"
    - url: "{{ sand_url }}/validation/wave/freefall/"
    - url: "{{ sand_url }}/validation/wave/rest_bed/"
    outputs:
    - url: "{{ output_url }}/{{workflow_id}}/train"
    checkpoint:
    - path: "{{output}}/model"
      url: "{{ output_url }}/{{workflow_id}}/train/model"
      frequency: 10m

default-values:
  # object categories (lateral_push, vertical_push, impact, rest)
  object_url: swift://PRIVATE_BUCKET/particle-nerd-mpm-benchmark/v1
  # sand-only categories (freefall, rest_bed): the regenerated files, same scene and settings as the object episodes
  sand_url: swift://PRIVATE_BUCKET/particle-nerd-mpm-benchmark/v1.1
  image: nvcr.io/nvidia/isaac-lab:3.0.0-rc1
  platform: ovx-l40
  uv_version: 0.12.12
  workflow_name: particle-nerd-train
  # the pool isaac-lab-l40-07 allows about 98 Gi of disk per GPU
  storage: 390Gi
  steps: 12000
  rest_fraction: 0.02
  rest_steps: 800
  rest_segment: 50
  # more train.py arguments
  extra_args: ""
  output_url: ""
  source_url: ""
  source_sha256: ""

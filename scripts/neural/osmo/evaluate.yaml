# Benchmark two checkpoints against MPM on the test episodes.
# Submit with: scripts/neural/osmo/submit.sh --workflow scripts/neural/osmo/evaluate.yaml PRIVATE_OUTPUT_URI \
#   --set-string checkpoint_a=URL label_a=NAME checkpoint_b=URL label_b=NAME
# A checkpoint URL is a folder that holds best.pt, for example the model folder of a training workflow.
# One <label>.json per checkpoint and sleeping threshold is written to <PRIVATE_OUTPUT_URI>/<workflow id>/eval.
workflow:
  name: "{{ workflow_name }}"
  resources:
    default:
      gpu: 1
      cpu: 8
      memory: 32Gi
      storage: "{{ storage }}"
      platform: "{{ platform }}"
  tasks:
  - name: eval
    image: "{{ image }}"
    command: [bash, /tmp/run.sh]
    environment:
      HEADLESS: "1"
      PYTHONUNBUFFERED: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
      UV_PROJECT_ENVIRONMENT: /tmp/isaaclab-venv
      UV_INSTALL_DIR: /tmp/uv
      UV_NO_MODIFY_PATH: "1"
      UV_VERSION: "{{ uv_version }}"
    files:
    - path: /tmp/run.sh
      contents: |
        set -euo pipefail
        mkdir -p '{{output}}'
        exec > >(tee -a "{{output}}/job.log") 2>&1
        printf '%s  %s\n' '{{ source_sha256 }}' '{{input:0}}/source.tar.gz' | sha256sum --check --strict
        mkdir -p /tmp/isaaclab
        tar -xzf '{{input:0}}/source.tar.gz' -C /tmp/isaaclab
        data_root=$(dirname '{{input:0}}')
        unset PYTHONPATH VIRTUAL_ENV DISPLAY
        export PATH="/tmp/uv:$PATH"
        if ! command -v uv >/dev/null; then
          curl --fail --location --retry 3 "https://astral.sh/uv/{{ uv_version }}/install.sh" | sh
        fi
        cd /tmp/isaaclab
        uv sync --locked --no-dev
        for label in a b; do
          case $label in a) ckpt='{{input:1}}'; name='{{ label_a }}' ;; b) ckpt='{{input:2}}'; name='{{ label_b }}' ;; esac
          # one evaluation per particle-sleeping threshold [m/s]; 0 is the plain model
          for sleep in {{ sleep_speeds }}; do
            suffix=""
            if [ "$sleep" != "0" ]; then suffix="_sleep$sleep"; fi
            uv run --no-sync python scripts/neural/evaluate.py \
              --dataset "$data_root" --checkpoint "$(find "$ckpt" -name best.pt | sort | head -n 1)" \
              --label "$name$suffix" --output "{{output}}/$name$suffix.json" --per-cell '{{ per_cell }}' \
              --sleep-speed "$sleep" {{ eval_args }}
          done
        done
    inputs:
    - url: "{{ source_url }}"
    - url: "{{ checkpoint_a }}"
    - url: "{{ checkpoint_b }}"
    - url: "{{ object_url }}/test/flat/lateral_push/"
    - url: "{{ object_url }}/test/flat/vertical_push/"
    - url: "{{ object_url }}/test/flat/impact/"
    - url: "{{ object_url }}/test/flat/rest/"
    - url: "{{ sand_url }}/test/flat/freefall/"
    - url: "{{ sand_url }}/test/flat/rest_bed/"
    - url: "{{ object_url }}/test/slope/lateral_push/"
    - url: "{{ object_url }}/test/slope/vertical_push/"
    - url: "{{ object_url }}/test/slope/impact/"
    - url: "{{ object_url }}/test/slope/rest/"
    - url: "{{ sand_url }}/test/slope/freefall/"
    - url: "{{ sand_url }}/test/slope/rest_bed/"
    - url: "{{ object_url }}/test/wave/lateral_push/"
    - url: "{{ object_url }}/test/wave/vertical_push/"
    - url: "{{ object_url }}/test/wave/impact/"
    - url: "{{ object_url }}/test/wave/rest/"
    - url: "{{ sand_url }}/test/wave/freefall/"
    - url: "{{ sand_url }}/test/wave/rest_bed/"
    outputs:
    - url: "{{ output_url }}/{{workflow_id}}/eval"

default-values:
  # object categories (lateral_push, vertical_push, impact, rest)
  object_url: swift://pdx.s8k.io/AUTH_team-isaac-sqa/isaac-sqa/jkamohara/particle-nerd-mpm-benchmark/v1
  # sand-only categories (freefall, rest_bed): the regenerated files, same scene and settings as the object episodes
  sand_url: swift://pdx.s8k.io/AUTH_team-isaac-sqa/isaac-sqa/jkamohara/particle-nerd-mpm-benchmark/v1.1
  image: nvcr.io/nvidia/isaac-lab:3.0.0-rc1
  platform: ovx-l40
  uv_version: 0.12.12
  workflow_name: particle-nerd-evaluate
  # the pool isaac-lab-l40-07 allows about 98 Gi of disk per GPU
  storage: 95Gi
  per_cell: 2
  # particle-sleeping thresholds to evaluate [m/s], separated by spaces; 0 is the plain model
  sleep_speeds: "0"
  # more evaluate.py arguments, for example --active-k 2048 --anchors 256
  eval_args: ""
  checkpoint_a: ""
  label_a: a
  checkpoint_b: ""
  label_b: b
  output_url: ""
  source_url: ""
  source_sha256: ""

# Collect free-fall sand-block drops and horizontal tosses (cube, sphere, cylinder) on one 4-GPU node.
# Submit with: run_collection.sh --workflow collect_toss.yaml PRIVATE_OUTPUT_URI --pool POOL
workflow:
  name: "{{ workflow_name }}"
  resources:
    default:
      gpu: 4
      cpu: 32
      memory: 128Gi
      storage: 60Gi
      platform: "{{ platform }}"
  tasks:
  - name: collect-toss
    image: "{{ image }}"
    command: [bash, /tmp/run_collect.sh]
    environment:
      HEADLESS: "1"
      PYTHONUNBUFFERED: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
      UV_PROJECT_ENVIRONMENT: /tmp/isaaclab-venv
      UV_INSTALL_DIR: /tmp/uv
      UV_NO_MODIFY_PATH: "1"
      UV_VERSION: "{{ uv_version }}"
    files:
    - path: /tmp/run_collect.sh
      contents: |
        set -euo pipefail
        mkdir -p '{{output}}'
        exec > >(tee -a "{{output}}/collection.log") 2>&1
        printf '%s  %s\n' '{{ source_sha256 }}' '{{input:0}}/source.tar.gz' | sha256sum --check --strict
        mkdir -p /tmp/isaaclab
        tar -xzf '{{input:0}}/source.tar.gz' -C /tmp/isaaclab
        unset PYTHONPATH VIRTUAL_ENV DISPLAY
        export PATH="/tmp/uv:$PATH"
        if ! command -v uv >/dev/null; then
          curl --fail --location --retry 3 "https://astral.sh/uv/{{ uv_version }}/install.sh" | sh
        fi
        cd /tmp/isaaclab
        uv sync --locked --no-dev
        export PYTHONPATH=/tmp/isaaclab/examples
        uv run --no-sync torchrun --standalone --nproc_per_node=4 \
          --module particle_nerd_benchmark.learning.collect_freefall \
          --set toss --count '{{ count }}' --output '{{output}}'
    inputs:
    - url: "{{ source_url }}"
    outputs:
    - url: "{{ output_url }}/particle-nerd-freefall-toss-1/toss"

default-values:
  workflow_name: particle-nerd-freefall-toss-collect
  image: nvcr.io/nvidia/isaac-lab:3.0.0-rc1
  platform: ovx-l40s
  uv_version: 0.12.12
  count: 240
  output_url: ""
  source_url: ""
  source_sha256: ""

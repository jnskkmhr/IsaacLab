# Fine-tune particle_nerd_local from an existing checkpoint on a reduced data mix plus horizontal tosses.
# Submit with: run_collection.sh --workflow finetune.yaml PRIVATE_OUTPUT_URI --pool POOL --set-string update_mode=ballistic
workflow:
  name: "{{ workflow_name }}"
  resources:
    default:
      gpu: 4
      cpu: 32
      memory: 128Gi
      storage: 200Gi
      platform: "{{ platform }}"
  tasks:
  - name: finetune
    image: "{{ image }}"
    command: [bash, /tmp/run.sh]
    environment:
      HEADLESS: "1"
      PYTHONUNBUFFERED: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      NCCL_DEBUG: WARN
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
      UV_PROJECT_ENVIRONMENT: /tmp/isaaclab-venv
      UV_INSTALL_DIR: /tmp/uv
      UV_NO_MODIFY_PATH: "1"
      UV_VERSION: "{{ uv_version }}"
    files:
    - path: /tmp/run.sh
      contents: |
        set -euo pipefail
        mkdir -p '{{output}}'
        exec > >(tee -a "{{output}}/training.log") 2>&1
        printf '%s  %s\n' '{{ source_sha256 }}' '{{input:0}}/source.tar.gz' | sha256sum --check --strict
        mkdir -p /tmp/isaaclab
        tar -xzf '{{input:0}}/source.tar.gz' -C /tmp/isaaclab
        data_root=$(dirname '{{input:0}}')
        unset PYTHONPATH VIRTUAL_ENV DISPLAY
        export PATH="/tmp/uv:$PATH"
        if ! command -v uv >/dev/null; then
          curl --fail --location --retry 3 "https://astral.sh/uv/{{ uv_version }}/install.sh" | sh
        fi
        cd /tmp/isaaclab
        uv sync --locked --no-dev
        export PYTHONPATH=/tmp/isaaclab/examples
        uv run --no-sync torchrun --standalone --nproc_per_node=4 \
          --module particle_nerd_benchmark.learning.train \
          --data "$data_root" --output '{{output}}/model' --arch particle_nerd_local \
          --update-mode '{{ update_mode }}' --finetune-from '{{input:1}}/best.pt' \
          --steps '{{ steps }}' --horizon 100 --lr '{{ lr }}' --freefall-fraction '{{ freefall_fraction }}' \
          --validate-every 250 --validation-count 24 \
          --rest-fraction '{{ rest_fraction }}' --rest-steps '{{ rest_steps }}' --rest-segment '{{ rest_segment }}'
    inputs:
    - url: "{{ source_url }}"
    - url: "{{ checkpoint_url }}"
    - url: "{{ data_url }}/particle-nerd-objects-recovery-1/box-dynamic/"
    - url: "{{ data_url }}/particle-nerd-objects-600-2/sphere-dynamic/"
    - url: "{{ data_url }}/particle-nerd-objects-recovery-1/cylinder-dynamic/"
    - url: "{{ data_url }}/particle-nerd-objects-recovery-1/box-prescribed/"
    - url: "{{ data_url }}/particle-nerd-freefall-400-1/freefall/"
    - url: "{{ data_url }}/particle-nerd-freefall-toss-1/toss/"
    - url: "{{ data_url }}/particle-nerd-rest-1/rest/"
    outputs:
    - url: "{{ output_url }}/{{workflow_id}}/finetune"
    checkpoint:
    - path: "{{output}}/model"
      url: "{{ output_url }}/{{workflow_id}}/finetune/model"
      frequency: 10m

default-values:
  data_url: swift://PRIVATE_BUCKET/particle-nerd-object-benchmark
  workflow_name: particle-nerd-local-finetune
  image: nvcr.io/nvidia/isaac-lab:3.0.0-rc1
  platform: ovx-l40s
  uv_version: 0.12.12
  update_mode: ballistic
  steps: 4000
  lr: 0.0001
  freefall_fraction: 0.5
  rest_fraction: 0.0
  rest_steps: 800
  rest_segment: 50
  checkpoint_url: ""
  output_url: ""
  source_url: ""
  source_sha256: ""

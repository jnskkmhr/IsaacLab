# Ablation: the baseline recipe (train.yaml) on the old dataset without the prescribed (kinematic) episodes.
# Submit with: run_collection.sh --workflow train_no_prescribed.yaml PRIVATE_OUTPUT_URI --pool POOL
workflow:
  name: "{{ workflow_name }}"
  resources:
    default:
      gpu: 4
      cpu: 32
      memory: 128Gi
      storage: 250Gi
      platform: "{{ platform }}"
  tasks:
  - name: train
    image: "{{ image }}"
    command: [bash, /tmp/run.sh]
    environment:
      HEADLESS: "1"
      PYTHONUNBUFFERED: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      NCCL_DEBUG: WARN
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
      UV_PROJECT_ENVIRONMENT: /tmp/isaaclab-venv
      UV_INSTALL_DIR: /tmp/uv
      UV_NO_MODIFY_PATH: "1"
      UV_VERSION: "{{ uv_version }}"
    files:
    - path: /tmp/run.sh
      contents: |
        set -euo pipefail
        mkdir -p '{{output}}'
        exec > >(tee -a "{{output}}/job.log") 2>&1
        printf '%s  %s\n' '{{ source_sha256 }}' '{{input:0}}/source.tar.gz' | sha256sum --check --strict
        mkdir -p /tmp/isaaclab
        tar -xzf '{{input:0}}/source.tar.gz' -C /tmp/isaaclab
        data_root=$(dirname '{{input:0}}')
        unset PYTHONPATH VIRTUAL_ENV DISPLAY
        export PATH="/tmp/uv:$PATH"
        if ! command -v uv >/dev/null; then
          curl --fail --location --retry 3 "https://astral.sh/uv/{{ uv_version }}/install.sh" | sh
        fi
        cd /tmp/isaaclab
        uv sync --locked --no-dev
        export PYTHONPATH=/tmp/isaaclab/examples
        uv run --no-sync torchrun --standalone --nproc_per_node=4 \
          --module particle_nerd_benchmark.learning.train \
          --data "$data_root" --output '{{output}}/model' --arch particle_nerd_local \
          --steps '{{ steps }}' --horizon 100 --validation-count 24 \
          --far-support-scale 5.0 --far-gap-weight 0.3 --far-influence-weight 0.15
    inputs:
    - url: "{{ source_url }}"
    - url: "{{ data_url }}/particle-nerd-objects-600-2/sphere-dynamic/"
    - url: "{{ data_url }}/particle-nerd-objects-recovery-1/box-dynamic/"
    - url: "{{ data_url }}/particle-nerd-objects-recovery-1/cylinder-dynamic/"
    - url: "{{ data_url }}/particle-nerd-objects-freefall-400/freefall-dynamic/"
    outputs:
    - url: "{{ output_url }}/{{workflow_id}}/train"
    checkpoint:
    - path: "{{output}}/model"
      url: "{{ output_url }}/{{workflow_id}}/train/model"
      frequency: 10m

default-values:
  v1_url: swift://pdx.s8k.io/AUTH_team-isaac-sqa/isaac-sqa/jkamohara/particle-nerd-mpm-benchmark/v1
  data_url: swift://pdx.s8k.io/AUTH_team-isaac-sqa/isaac-sqa/jkamohara/particle-nerd-object-benchmark
  image: nvcr.io/nvidia/isaac-lab:3.0.0-rc1
  platform: ovx-l40s
  uv_version: 0.12.12
  workflow_name: particle-nerd-local-no-prescribed-train
  steps: 12000
  output_url: ""
  source_url: ""
  source_sha256: ""

# Fresh Particle NeRD training on object trajectories using the integrated Top-K method.
# run_collection.sh --workflow train_nerd.yaml PRIVATE_OUTPUT_URI --pool POOL
workflow:
  name: "{{ workflow_name }}"
  resources:
    default:
      gpu: 4
      cpu: 32
      memory: 128Gi
      storage: 250Gi
      platform: "{{ platform }}"
      nodesExcluded:
      - osmogroot-dgxc-k8s-forge-az41-prd1-w-3129
  tasks:
  - name: train
    image: "{{ image }}"
    command: [bash, /tmp/run.sh]
    environment:
      HEADLESS: "1"
      PYTHONUNBUFFERED: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      NCCL_DEBUG: WARN
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
      UV_PROJECT_ENVIRONMENT: /tmp/isaaclab-venv
      UV_INSTALL_DIR: /tmp/uv
      UV_NO_MODIFY_PATH: "1"
      UV_VERSION: "{{ uv_version }}"
    files:
    - path: /tmp/run.sh
      contents: |
        set -euo pipefail
        printf '%s  %s\n' '{{ source_sha256 }}' '{{input:0}}/source.tar.gz' | sha256sum --check --strict
        mkdir -p /tmp/isaaclab
        tar -xzf '{{input:0}}/source.tar.gz' -C /tmp/isaaclab
        data_root=$(dirname '{{input:0}}')
        bash /tmp/isaaclab/examples/particle_nerd_benchmark/learning/osmo/bootstrap.sh \
          '{{output}}' train "$data_root" \
          --arch '{{ arch }}' --steps '{{ steps }}' --horizon '{{ horizon }}' --validation-count '{{ validation_count }}'
    inputs:
    - url: "{{ source_url }}"
    - url: "{{ data_url }}/particle-nerd-objects-600-2/sphere-prescribed/"
    - url: "{{ data_url }}/particle-nerd-objects-600-2/sphere-dynamic/"
    - url: "{{ data_url }}/particle-nerd-objects-600-2/cylinder-prescribed/"
    - url: "{{ data_url }}/particle-nerd-objects-recovery-1/box-prescribed/"
    - url: "{{ data_url }}/particle-nerd-objects-recovery-1/box-dynamic/"
    - url: "{{ data_url }}/particle-nerd-objects-recovery-1/cylinder-dynamic/"
    outputs:
    - url: "{{ output_url }}/{{workflow_id}}/train"
    checkpoint:
    - path: "{{output}}/model"
      url: "{{ output_url }}/{{workflow_id}}/train/model"
      frequency: 10m

default-values:
  data_url: swift://PRIVATE_BUCKET/particle-nerd-object-benchmark
  workflow_name: particle-nerd-objects-topk-train
  arch: particle_transolver
  image: nvcr.io/nvidia/isaac-lab:3.0.0-rc1
  platform: ovx-l40s
  uv_version: 0.12.12
  steps: 12000
  horizon: 100
  validation_count: 24
  output_url: ""
  source_url: ""
  source_sha256: ""

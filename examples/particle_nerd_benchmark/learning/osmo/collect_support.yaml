# Collect long (20 s) drop-and-support trajectories of a free object resting on the bed: 20 per shape, six 1-GPU jobs.
# Submit with: run_collection.sh --workflow collect_support.yaml PRIVATE_OUTPUT_URI --pool POOL
workflow:
  name: "{{ workflow_name }}"
  resources:
    default:
      gpu: 1
      cpu: 14
      memory: 64Gi
      storage: 60Gi
      platform: "{{ platform }}"
  tasks:
  - &collector
    name: collect-support-box-a
    image: "{{ image }}"
    args: [box, "0", "9"]
    command: [bash, /tmp/run.sh]
    environment:
      HEADLESS: "1"
      PYTHONUNBUFFERED: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
      UV_PROJECT_ENVIRONMENT: /tmp/isaaclab-venv
      UV_INSTALL_DIR: /tmp/uv
      UV_NO_MODIFY_PATH: "1"
      UV_VERSION: "{{ uv_version }}"
    files:
    - path: /tmp/run.sh
      contents: |
        set -euo pipefail
        shape=$1; first=$2; last=$3
        mkdir -p '{{output}}'
        exec > >(tee -a "{{output}}/collection.log") 2>&1
        printf '%s  %s\n' '{{ source_sha256 }}' '{{input:0}}/source.tar.gz' | sha256sum --check --strict
        mkdir -p /tmp/isaaclab
        tar -xzf '{{input:0}}/source.tar.gz' -C /tmp/isaaclab
        unset PYTHONPATH VIRTUAL_ENV DISPLAY
        export PATH="/tmp/uv:$PATH"
        if ! command -v uv >/dev/null; then
          curl --fail --location --retry 3 "https://astral.sh/uv/{{ uv_version }}/install.sh" | sh
        fi
        cd /tmp/isaaclab
        uv sync --locked --no-dev
        export PYTHONPATH=/tmp/isaaclab/examples
        ids=$(for i in $(seq "$first" "$last"); do printf '%s-support-%04d ' "$shape" "$i"; done)
        uv run --no-sync python -m particle_nerd_benchmark.learning.collect \
          --shape "$shape" --mode dynamic --support 20 --episode-ids $ids --output '{{output}}' --device cuda:0
    inputs:
    - url: "{{ source_url }}"
    outputs:
    - url: "{{ output_url }}/particle-nerd-support-1/box-a"

  - <<: *collector
    name: collect-support-box-b
    args: [box, "10", "19"]
    outputs:
    - url: "{{ output_url }}/particle-nerd-support-1/box-b"

  - <<: *collector
    name: collect-support-sphere-a
    args: [sphere, "0", "9"]
    outputs:
    - url: "{{ output_url }}/particle-nerd-support-1/sphere-a"

  - <<: *collector
    name: collect-support-sphere-b
    args: [sphere, "10", "19"]
    outputs:
    - url: "{{ output_url }}/particle-nerd-support-1/sphere-b"

  - <<: *collector
    name: collect-support-cylinder-a
    args: [cylinder, "0", "9"]
    outputs:
    - url: "{{ output_url }}/particle-nerd-support-1/cylinder-a"

  - <<: *collector
    name: collect-support-cylinder-b
    args: [cylinder, "10", "19"]
    outputs:
    - url: "{{ output_url }}/particle-nerd-support-1/cylinder-b"

default-values:
  workflow_name: particle-nerd-support-collect
  image: nvcr.io/nvidia/isaac-lab:3.0.0-rc1
  platform: ovx-l40s
  uv_version: 0.12.12
  output_url: ""
  source_url: ""
  source_sha256: ""

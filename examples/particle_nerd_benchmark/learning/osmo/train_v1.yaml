# From-scratch Particle NeRD Local training on the terrain / category dataset (train + validation splits).
# Submit with: run_collection.sh --workflow train_v1.yaml PRIVATE_OUTPUT_URI --pool POOL
workflow:
  name: "{{ workflow_name }}"
  resources:
    default:
      gpu: 4
      cpu: 32
      memory: 128Gi
      storage: "{{ storage }}"
      platform: "{{ platform }}"
  tasks:
  - name: train
    image: "{{ image }}"
    command: [bash, /tmp/run.sh]
    environment:
      HEADLESS: "1"
      PYTHONUNBUFFERED: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      NCCL_DEBUG: WARN
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
      UV_PROJECT_ENVIRONMENT: /tmp/isaaclab-venv
      UV_INSTALL_DIR: /tmp/uv
      UV_NO_MODIFY_PATH: "1"
      UV_VERSION: "{{ uv_version }}"
    files:
    - path: /tmp/run.sh
      contents: |
        set -euo pipefail
        mkdir -p '{{output}}'
        exec > >(tee -a "{{output}}/job.log") 2>&1
        printf '%s  %s\n' '{{ source_sha256 }}' '{{input:0}}/source.tar.gz' | sha256sum --check --strict
        mkdir -p /tmp/isaaclab
        tar -xzf '{{input:0}}/source.tar.gz' -C /tmp/isaaclab
        data_root=$(dirname '{{input:0}}')
        unset PYTHONPATH VIRTUAL_ENV DISPLAY
        export PATH="/tmp/uv:$PATH"
        if ! command -v uv >/dev/null; then
          curl --fail --location --retry 3 "https://astral.sh/uv/{{ uv_version }}/install.sh" | sh
        fi
        cd /tmp/isaaclab
        uv sync --locked --no-dev
        export PYTHONPATH=/tmp/isaaclab/examples
        uv run --no-sync torchrun --standalone --nproc_per_node=4 \
          --module particle_nerd_benchmark.learning.train \
          --data "$data_root" --output '{{output}}/model' --data-format v1 --arch particle_nerd_local \
          --steps '{{ steps }}' --horizon 100 --validation-count 24 --validate-every 250 \
          --far-support-scale 5.0 --far-gap-weight 0.3 --far-influence-weight 0.15 \
          --freefall-fraction '{{ freefall_fraction }}' \
          --rest-fraction '{{ rest_fraction }}' --rest-steps '{{ rest_steps }}' --rest-segment '{{ rest_segment }}' \
          {{ extra_args }}
    inputs:
    - url: "{{ source_url }}"
    - url: "{{ v1_url }}/train/flat/lateral_push/"
    - url: "{{ v1_url }}/train/flat/vertical_push/"
    - url: "{{ v1_url }}/train/flat/impact/"
    - url: "{{ v1_url }}/train/flat/rest/"
    - url: "{{ sand_url }}/train/flat/freefall/"
    - url: "{{ sand_url }}/train/flat/rest_bed/"
    - url: "{{ v1_url }}/train/slope/lateral_push/"
    - url: "{{ v1_url }}/train/slope/vertical_push/"
    - url: "{{ v1_url }}/train/slope/impact/"
    - url: "{{ v1_url }}/train/slope/rest/"
    - url: "{{ sand_url }}/train/slope/freefall/"
    - url: "{{ sand_url }}/train/slope/rest_bed/"
    - url: "{{ v1_url }}/train/wave/lateral_push/"
    - url: "{{ v1_url }}/train/wave/vertical_push/"
    - url: "{{ v1_url }}/train/wave/impact/"
    - url: "{{ v1_url }}/train/wave/rest/"
    - url: "{{ sand_url }}/train/wave/freefall/"
    - url: "{{ sand_url }}/train/wave/rest_bed/"
    - url: "{{ v1_url }}/validation/flat/lateral_push/"
    - url: "{{ v1_url }}/validation/flat/vertical_push/"
    - url: "{{ v1_url }}/validation/flat/impact/"
    - url: "{{ v1_url }}/validation/flat/rest/"
    - url: "{{ sand_url }}/validation/flat/freefall/"
    - url: "{{ sand_url }}/validation/flat/rest_bed/"
    - url: "{{ v1_url }}/validation/slope/lateral_push/"
    - url: "{{ v1_url }}/validation/slope/vertical_push/"
    - url: "{{ v1_url }}/validation/slope/impact/"
    - url: "{{ v1_url }}/validation/slope/rest/"
    - url: "{{ sand_url }}/validation/slope/freefall/"
    - url: "{{ sand_url }}/validation/slope/rest_bed/"
    - url: "{{ v1_url }}/validation/wave/lateral_push/"
    - url: "{{ v1_url }}/validation/wave/vertical_push/"
    - url: "{{ v1_url }}/validation/wave/impact/"
    - url: "{{ v1_url }}/validation/wave/rest/"
    - url: "{{ sand_url }}/validation/wave/freefall/"
    - url: "{{ sand_url }}/validation/wave/rest_bed/"
    outputs:
    - url: "{{ output_url }}/{{workflow_id}}/train"
    checkpoint:
    - path: "{{output}}/model"
      url: "{{ output_url }}/{{workflow_id}}/train/model"
      frequency: 10m

default-values:
  v1_url: swift://pdx.s8k.io/AUTH_team-isaac-sqa/isaac-sqa/jkamohara/particle-nerd-mpm-benchmark/v1
  # freefall and rest_bed come from the regenerated files (same scene and settings as the object episodes)
  sand_url: swift://pdx.s8k.io/AUTH_team-isaac-sqa/isaac-sqa/jkamohara/particle-nerd-mpm-benchmark/v1.1
  data_url: swift://pdx.s8k.io/AUTH_team-isaac-sqa/isaac-sqa/jkamohara/particle-nerd-object-benchmark
  image: nvcr.io/nvidia/isaac-lab:3.0.0-rc1
  platform: ovx-l40s
  uv_version: 0.12.12
  workflow_name: particle-nerd-local-v1-train
  storage: 500Gi
  steps: 12000
  freefall_fraction: 0.3
  rest_fraction: 0.02
  rest_steps: 800
  rest_segment: 50
  # extra train.py arguments, for example --rest-windows
  extra_args: ""
  output_url: ""
  source_url: ""
  source_sha256: ""

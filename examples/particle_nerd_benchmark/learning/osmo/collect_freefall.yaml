# Collect all 400 open flat-ground free-fall trajectories across 4 parallel 4-GPU groups (16 GPUs total, 25 episodes/GPU):
workflow:
  name: "{{ workflow_name }}"
  resources:
    default:
      gpu: 4
      cpu: 32
      memory: 128Gi
      storage: 120Gi
      platform: "{{ platform }}"
      nodesExcluded:
      - osmogroot-dgxc-k8s-forge-az41-prd1-w-3129
      - osmogroot-dgxc-k8s-forge-az41-prd1-w-1165
  groups:
  - name: shard-0-group
    tasks:
    - name: collect-shard-0
      image: "{{ image }}"
      command: [bash, /tmp/run_collect.sh, "0", "4"]
      environment: &env
        HEADLESS: "1"
        PYTHONUNBUFFERED: "1"
        NVIDIA_DRIVER_CAPABILITIES: compute,utility
        OMP_NUM_THREADS: "8"
        MKL_NUM_THREADS: "8"
        OPENBLAS_NUM_THREADS: "8"
        UV_PYTHON: "3.12"
        UV_PYTHON_PREFERENCE: only-managed
        UV_PROJECT_ENVIRONMENT: /tmp/isaaclab-venv
        UV_INSTALL_DIR: /tmp/uv
        UV_NO_MODIFY_PATH: "1"
        UV_VERSION: "{{ uv_version }}"
      files: &files
      - path: /tmp/run_collect.sh
        contents: |
          set -euo pipefail
          shard_id=${1:?}
          num_shards=${2:?}
          mkdir -p '{{output}}'
          exec > >(tee -a "{{output}}/collection_shard_${shard_id}.log") 2>&1
          printf '%s  %s\n' '{{ source_sha256 }}' '{{input:0}}/source.tar.gz' | sha256sum --check --strict
          mkdir -p /tmp/isaaclab
          tar -xzf '{{input:0}}/source.tar.gz' -C /tmp/isaaclab
          unset PYTHONPATH VIRTUAL_ENV DISPLAY
          export PATH="/tmp/uv:$PATH"
          if ! command -v uv >/dev/null; then
            curl --fail --location --retry 3 "https://astral.sh/uv/{{ uv_version }}/install.sh" | sh
          fi
          cd /tmp/isaaclab
          uv sync --locked --no-dev
          export PYTHONPATH=/tmp/isaaclab/examples
          uv run --no-sync torchrun --standalone --nproc_per_node=4 \
            --module particle_nerd_benchmark.learning.collect_freefall \
            --output '{{output}}' --shard-id "$shard_id" --num-shards "$num_shards"
      inputs: &inputs
      - url: "{{ source_url }}"
      outputs: &outputs
      - url: "{{ output_url }}/particle-nerd-objects-freefall-400/freefall-dynamic"
  - name: shard-1-group
    tasks:
    - name: collect-shard-1
      image: "{{ image }}"
      command: [bash, /tmp/run_collect.sh, "1", "4"]
      environment: *env
      files: *files
      inputs: *inputs
      outputs: *outputs
  - name: shard-2-group
    tasks:
    - name: collect-shard-2
      image: "{{ image }}"
      command: [bash, /tmp/run_collect.sh, "2", "4"]
      environment: *env
      files: *files
      inputs: *inputs
      outputs: *outputs
  - name: shard-3-group
    tasks:
    - name: collect-shard-3
      image: "{{ image }}"
      command: [bash, /tmp/run_collect.sh, "3", "4"]
      environment: *env
      files: *files
      inputs: *inputs
      outputs: *outputs

default-values:
  workflow_name: particle-nerd-objects-freefall-400-16gpu
  image: nvcr.io/nvidia/isaac-lab:3.0.0-rc1
  platform: ovx-l40s
  uv_version: 0.12.12
  output_url: ""
  source_url: ""
  source_sha256: ""

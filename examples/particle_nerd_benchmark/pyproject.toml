[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-nerd-benchmark"
version = "0.1.0"
description = "Registered native MPM reference examples for Isaac Lab"
requires-python = ">=3.12"

[project.entry-points."isaaclab.tasks"]
particle_nerd_benchmark = "particle_nerd_benchmark.config"

[tool.setuptools.packages.find]
where = [".."]
include = ["particle_nerd_benchmark*"]
namespaces = false

[tool.setuptools.package-dir]
"" = ".."

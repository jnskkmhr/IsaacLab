workflow:
  name: particle-gnn-region
  resources:
    default:
      gpu: 4
      cpu: 16
      memory: 128Gi
      storage: 250Gi
      platform: ovx-l40
  tasks:
  - name: region
    image: nvcr.io/nvidia/isaac-lab:3.0.0-rc1
    command: [bash, -c]
    args:
    - |
      set -euo pipefail
      mkdir -p /tmp/particle-gnn "{{output}}"
      cd "{{input:0}}"
      sha256sum --check bundle.sha256
      tar -xzf bundle.tar.gz -C /tmp/particle-gnn
      cp /tmp/particle-gnn/bundle/snapshot.json "{{output}}/snapshot.json"
      export PARTICLE_OUTPUT="{{output}}"
      export PARTICLE_DATA="{{input:1}}"
      export PARTICLE_BASELINE="{{input:2}}/best.pt"
      test -s "$PARTICLE_BASELINE"
      bash /tmp/particle-gnn/bundle/isaaclab/examples/particle_nerd/osmo/bootstrap.sh \
        bash -c '
          set -euo pipefail
          python -m particle_nerd.osmo.region_verify_gpus
          python -m particle_nerd.gnn.region_campaign \
            --data "$PARTICLE_DATA" \
            --checkpoint "$PARTICLE_BASELINE" \
            --output "$PARTICLE_OUTPUT"
        '

    environment:
      HEADLESS: "1"
      PYOPENGL_PLATFORM: egl
      PYTHONUNBUFFERED: "1"
      NVIDIA_DRIVER_CAPABILITIES: all
    inputs:
    - url: "{{ source_url }}"
    - url: "{{ dataset_url }}"
    - url: "{{ model_url }}"
    outputs:
    - url: swift://pdx.s8k.io/AUTH_team-isaac-sqa/isaac-sqa/jkamohara/particle-gnn/runs/{{workflow_id}}/
    checkpoint:
    - path: "{{output}}"
      url: swift://pdx.s8k.io/AUTH_team-isaac-sqa/isaac-sqa/jkamohara/particle-gnn/runs/{{workflow_id}}/checkpoints/
      frequency: 5m
      regex: '.*\.(pt|json|jsonl|csv)$'
default-values:
  source_url: ""
  dataset_url: ""
  model_url: ""

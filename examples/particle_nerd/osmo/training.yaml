workflow:
  name: "{{ workflow_name }}"
  resources:
    default:
      gpu: 4
      cpu: 16
      memory: 128Gi
      storage: 250Gi
      platform: ovx-l40
  tasks:
  - name: train
    image: nvcr.io/nvidia/isaac-lab:3.0.0-rc1
    command: [bash, -c]
    args:
    - |
      set -euo pipefail
      mkdir -p /tmp/particle-gnn "{{output}}/model"
      cd "{{input:0}}"
      sha256sum --check bundle.sha256
      tar -xzf bundle.tar.gz -C /tmp/particle-gnn
      cp /tmp/particle-gnn/bundle/snapshot.json "{{output}}/snapshot.json"
      export PARTICLE_OUTPUT="{{output}}"
      export PARTICLE_DATA="{{input:1}}"
      bash /tmp/particle-gnn/bundle/isaaclab/examples/particle_nerd/osmo/bootstrap.sh \
        bash -c '
          set -euo pipefail
          python -m particle_nerd.gnn.verify --output "$PARTICLE_OUTPUT/verification.json"
          torchrun --standalone --nproc_per_node=4 --module particle_nerd.gnn.train \
            --data "$PARTICLE_DATA" --output "$PARTICLE_OUTPUT/model" --steps {{ num_steps }}
          python -m particle_nerd.gnn.evaluate --data "$PARTICLE_DATA" \
            --checkpoint "$PARTICLE_OUTPUT/model/best.pt" \
            --output "$PARTICLE_OUTPUT/evaluation" --episodes 12 --steps 250
        '
    environment:
      HEADLESS: "1"
      PYOPENGL_PLATFORM: egl
      PYTHONUNBUFFERED: "1"
      NVIDIA_DRIVER_CAPABILITIES: all
      NCCL_DEBUG: WARN
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    inputs:
    - url: "{{ source_url }}"
    - url: "{{ dataset_url }}"
    outputs:
    - url: "{{ output_url }}/{{workflow_id}}"
    checkpoint:
    - path: "{{output}}/model"
      url: "{{ output_url }}/{{workflow_id}}/model"
      frequency: 5m
      regex: '.*\.(pt|json|jsonl|csv)$'
default-values:
  workflow_name: particle-gnn-train
  num_steps: 10000
  source_url: ""
  dataset_url: ""
  output_url: swift://pdx.s8k.io/AUTH_team-isaac-sqa/isaac-sqa/jkamohara/particle-gnn/runs

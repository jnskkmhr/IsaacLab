workflow:
  name: particle-g1-collect-500
  resources:
    default:
      cpu: 8
      gpu: 1
      memory: 64Gi
      platform: ovx-l40s
      storage: 192Gi
  tasks:
  - args:
    - |
      set -euo pipefail
      mkdir -p /tmp/g1-nerd "{{output}}/data"
      exec > >(tee -a "{{output}}/runtime.log") 2>&1
      cd "{{input:0}}"
      sha256sum --check source.sha256
      tar -xzf source.tar.gz -C /tmp/g1-nerd
      cd /tmp/g1-nerd/source
      unset PYTHONPATH VIRTUAL_ENV DISPLAY
      export PATH="/tmp/g1-uv:$PATH"
      if ! command -v uv >/dev/null; then
        curl --fail --location --retry 3 https://astral.sh/uv/0.12.12/install.sh | sh
      fi
      uv sync --locked --extra rsl-rl
      export PYTHONPATH="$PWD/examples"
      export PARTICLE_OUTPUT="{{output}}"
      cp deployment/snapshot.json "{{output}}/snapshot.json"
      cp deployment/commands.json "{{output}}/commands.json"
      uv run --no-sync python -m particle_nerd.g1.collect \
        --limit 500 --shard 0 --shards 16 \
        --num-envs 2 --duration 5 --headless \
        --schedule deployment/commands.json \
        --checkpoint deployment/policy/model_39998.pt \
        --output "{{output}}/data"
    checkpoint:
    - frequency: 5m
      path: '{{output}}'
      regex: .*\.(json|log)$
      url: swift://pdx.s8k.io/AUTH_team-isaac-sqa/isaac-sqa/jkamohara/particle-g1-nerd/20261020/collection/{{workflow_id}}/shard-0
    command:
    - bash
    - -c
    environment:
      HEADLESS: '1'
      NVIDIA_DRIVER_CAPABILITIES: all
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      PYOPENGL_PLATFORM: egl
      PYTHONUNBUFFERED: '1'
      UV_INSTALL_DIR: /tmp/g1-uv
      UV_NO_MODIFY_PATH: '1'
      UV_PROJECT_ENVIRONMENT: /tmp/g1-venv
      UV_PYTHON: '3.12'
      UV_PYTHON_PREFERENCE: only-managed
    image: nvcr.io/nvidia/isaac-lab:3.0.0-rc1
    inputs:
    - url: swift://pdx.s8k.io/AUTH_team-isaac-sqa/isaac-sqa/jkamohara/particle-g1-nerd/20261020/snapshots/collector-pilot50-retry2/
    name: collect-0
